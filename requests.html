<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Requests · Gal's Arcade</title>
    <meta name="description" content="Ask for something, vote for what you want, or say what's broken." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>&#127918;</text></svg>" />
    <style>
      /* Same palette as the shelf so this reads as part of the arcade. */
      :root {
        color-scheme: dark;
        --bg: #0c0e12;
        --card: rgba(255, 255, 255, 0.035);
        --line: rgba(255, 255, 255, 0.09);
        --fg: #e6e9ef;
        --dim: #8b94a5;
        --accent: #ffce54;
        --broken: #ff9a8b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      header, main, footer { max-width: 780px; margin: 0 auto; padding: 0 24px; }
      header { padding-top: 56px; padding-bottom: 28px; }

      h1 {
        margin: 0;
        font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent);
      }

      header p { margin: 14px 0 0; max-width: 52ch; color: var(--dim); }
      header a, footer a { color: var(--dim); }

      .form {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
        display: grid;
        gap: 14px;
      }

      .row { display: flex; gap: 12px; flex-wrap: wrap; }
      .row > label { flex: 1 1 200px; }

      label, .cap {
        display: grid;
        gap: 6px;
        font: 600 10.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
      }

      select, input, textarea {
        font: inherit;
        color: var(--fg);
        background: #12151b;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        width: 100%;
      }

      select:focus, input:focus, textarea:focus {
        outline: none;
        border-color: rgba(255, 206, 84, 0.45);
      }

      textarea { min-height: 92px; resize: vertical; }

      .send {
        justify-self: start;
        background: var(--accent);
        color: #0c0e12;
        font: 650 13.5px/1 ui-sans-serif, system-ui, sans-serif;
        padding: 11px 22px;
        border: 0;
        border-radius: 7px;
        cursor: pointer;
      }

      .send:hover { background: #ffd977; }

      .bar {
        display: flex;
        align-items: baseline;
        gap: 14px;
        margin: 44px 0 0;
        flex-wrap: wrap;
      }

      h2 {
        margin: 0;
        font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--dim);
      }

      .sort {
        margin-left: auto;
        display: flex;
        gap: 6px;
        font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .sort button {
        background: none;
        border: 1px solid transparent;
        border-radius: 5px;
        color: #5a6270;
        font: inherit;
        padding: 5px 9px;
        cursor: pointer;
      }

      .sort button[aria-pressed='true'] { color: var(--accent); border-color: rgba(255, 206, 84, 0.35); }

      .list { display: grid; gap: 12px; margin: 18px 0 0; padding: 0; list-style: none; }

      .req {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 15px 17px;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0 16px;
      }

      /* The vote sits outside the text so the count reads at a glance down the column. */
      .vote {
        grid-row: 1 / span 3;
        align-self: start;
        display: grid;
        justify-items: center;
        gap: 1px;
        min-width: 52px;
        padding: 7px 0 6px;
        background: none;
        border: 1px solid var(--line);
        border-radius: 9px;
        color: var(--dim);
        font: inherit;
        cursor: pointer;
      }

      .vote:hover { border-color: rgba(255, 206, 84, 0.35); color: var(--fg); }

      .vote[aria-pressed='true'] {
        border-color: rgba(255, 206, 84, 0.5);
        background: rgba(255, 206, 84, 0.09);
        color: var(--accent);
      }

      .vote .n { font-size: 16px; font-weight: 650; line-height: 1.1; }

      .vote .cap2 {
        font: 600 8.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .meta {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        margin: 0;
        font: 600 9.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }

      .pill { border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; color: var(--fg); }
      .pill--broken { color: var(--broken); border-color: rgba(255, 154, 139, 0.4); }
      .pill--wanted { color: var(--accent); border-color: rgba(255, 206, 84, 0.4); }

      .state {
        width: auto;
        padding: 2px 6px;
        font: 600 9.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: none;
        border-radius: 4px;
        color: var(--dim);
      }

      .said { margin: 10px 0 0; white-space: pre-wrap; }

      .talk {
        grid-column: 2;
        margin: 12px 0 0;
        border-top: 1px solid var(--line);
        padding-top: 11px;
      }

      .talk summary {
        cursor: pointer;
        color: var(--dim);
        font: 600 9.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .talk summary:hover { color: var(--fg); }

      .notes { display: grid; gap: 10px; margin: 12px 0 0; padding: 0; list-style: none; }

      .note .who {
        font: 600 9.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }

      .note p { margin: 2px 0 0; white-space: pre-wrap; }

      .reply { display: flex; gap: 8px; margin: 12px 0 0; }
      .reply input { flex: 1; }

      .reply button {
        background: none;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--dim);
        font: inherit;
        font-size: 13px;
        padding: 0 14px;
        cursor: pointer;
      }

      .reply button:hover { border-color: rgba(255, 206, 84, 0.4); color: var(--fg); }

      .vote[disabled], .send[disabled], .reply button[disabled], .state[disabled] {
        opacity: 0.55;
        cursor: default;
      }

      .empty { margin: 18px 0 0; color: #5a6270; }
      footer { padding: 44px 24px 56px; color: #5a6270; font-size: 12.5px; }

      .note-box {
        margin: 18px 0 0;
        padding: 12px 15px;
        border: 1px dashed rgba(255, 206, 84, 0.3);
        border-radius: 10px;
        color: var(--dim);
        font-size: 12.5px;
      }

      .note-box--bad { border-color: rgba(255, 154, 139, 0.45); color: var(--broken); }
    </style>
  </head>
  <body>
    <header>
      <h1>Requests</h1>
      <p>
        Something broken, or something you wish it did? Say so here, and vote for
        what other people asked for. <a href="/">Back to the games</a>.
      </p>
    </header>

    <main>
      <form class="form" id="form">
        <div class="row">
          <label>
            Which game
            <select id="game" required></select>
          </label>
          <label>
            What kind
            <select id="kind" required>
              <option value="broken">Something's broken</option>
              <option value="wanted">I want something</option>
            </select>
          </label>
        </div>

        <label>
          What happened
          <textarea id="said" required></textarea>
        </label>

        <label>
          Your name
          <input id="who" required placeholder="So we can ask you about it" autocomplete="name" />
        </label>

        <button class="send" type="submit">Send it</button>
      </form>

      <p class="note-box" id="trouble" hidden></p>

      <div class="bar">
        <h2>What's been asked for</h2>
        <div class="sort" id="sort">
          <button type="button" data-sort="votes">Most wanted</button>
          <button type="button" data-sort="new">Newest</button>
        </div>
      </div>

      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>Nothing yet. Yours would be the first.</p>
    </main>

    <footer>Built by Gal. <a href="https://github.com/galmadar">github.com/galmadar</a></footer>

    <script>
      // The shelf in index.html is the real list; this copy keeps the page standalone.
      const GAMES = [
        { id: 'cranes-game', name: 'Cranes Game' },
        { id: 'rail-yard', name: 'Rail Yard' },
        { id: 'gal-arcade', name: 'The arcade itself' },
      ];

      const STATUSES = ['new', 'in review', 'develop', 'done in production', 'declined'];

      // A hint per kind beats extra fields: it steers what people write without asking more of them.
      const HINTS = {
        broken: 'The crane drops the load when I spin the cab too fast.',
        wanted: 'A horn on the loco would be great.',
      };

      // The board itself lives in the database now. Only what is truly this
      // browser's — who you are, which browser this is, how you like it sorted,
      // and Gal's password — is kept here.
      const WHO = 'arcade-who';
      const SORT = 'arcade-sort';
      const BROWSER = 'arcade-browser';
      const ADMIN = 'arcade-admin';

      const form = document.getElementById('form');
      const gameSel = document.getElementById('game');
      const kindSel = document.getElementById('kind');
      const said = document.getElementById('said');
      const who = document.getElementById('who');
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      const sortBar = document.getElementById('sort');
      const trouble = document.getElementById('trouble');
      const send = form.querySelector('.send');

      function read(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw === null ? fallback : JSON.parse(raw);
        } catch {
          return fallback;
        }
      }

      function write(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {
          /* private window, or storage is off: the page still works, it just forgets. */
        }
      }

      // Generated once and never shown to anyone: this random id is the whole of
      // "one vote per browser", and the database indexes on it.
      function browserId() {
        const known = read(BROWSER, '');
        if (known) return known;

        const fresh =
          typeof crypto !== 'undefined' && crypto.randomUUID
            ? crypto.randomUUID()
            : String(Date.now()) + '-' + Math.random().toString(36).slice(2);

        write(BROWSER, fresh);
        return fresh;
      }

      const me = browserId();

      let admin = read(ADMIN, '');
      let sortBy = read(SORT, 'votes') === 'new' ? 'new' : 'votes';
      let rows = [];
      let loaded = false;
      const open = new Set();

      for (const game of GAMES) {
        const opt = document.createElement('option');
        opt.value = game.id;
        opt.textContent = game.name;
        gameSel.append(opt);
      }

      const params = new URLSearchParams(location.search);

      // Arriving from a game preselects it, so that field costs nothing.
      const from = params.get('game');
      if (from && GAMES.some((g) => g.id === from)) gameSel.value = from;

      // Gal types his password once, at /requests.html?admin, and it stays in his
      // browser. It travels as a header and appears nowhere in this page.
      if (params.has('admin')) {
        const typed = window.prompt('Password', admin);
        if (typed !== null) {
          admin = typed.trim();
          write(ADMIN, admin);
        }
        params.delete('admin');
        const rest = params.toString();
        history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''));
      }

      who.value = read(WHO, '');
      said.placeholder = HINTS[kindSel.value];
      kindSel.addEventListener('change', () => (said.placeholder = HINTS[kindSel.value]));

      function nameOf(id) {
        const game = GAMES.find((g) => g.id === id);
        return game ? game.name : id;
      }

      function whenOf(iso) {
        const days = Math.floor((Date.now() - new Date(iso)) / 86400000);
        if (days < 1) return 'today';
        if (days === 1) return 'yesterday';
        return days + ' days ago';
      }

      function say(message) {
        trouble.textContent = message;
        trouble.classList.add('note-box--bad');
        trouble.hidden = false;
      }

      function quiet() {
        trouble.hidden = true;
      }

      function post(payload, headers) {
        return {
          method: 'POST',
          headers: Object.assign({ 'content-type': 'application/json' }, headers),
          body: JSON.stringify(payload),
        };
      }

      // Every failure has to end up as a sentence someone can read, so nothing
      // here is allowed to reject with a stack trace or leave the page blank.
      async function api(path, options) {
        let res;
        try {
          res = await fetch(path, options);
        } catch {
          throw new Error("The board isn't answering. Check your connection and try again.");
        }

        let payload = null;
        try {
          payload = await res.json();
        } catch {
          /* an error page instead of JSON: the status code is all we have to go on. */
        }

        if (!res.ok) {
          const error = new Error(
            (payload && payload.error) || 'The board answered with an error (' + res.status + ').',
          );
          error.status = res.status;
          throw error;
        }

        return payload;
      }

      async function load() {
        try {
          const data = await api(
            '/api/requests?sort=' + encodeURIComponent(sortBy) + '&browser=' + encodeURIComponent(me),
          );
          rows = data.requests;
          loaded = true;
          quiet();
        } catch (error) {
          say(error.message);
        }

        render();
      }

      function renderVote(req) {
        const button = document.createElement('button');
        button.className = 'vote';
        button.type = 'button';
        button.setAttribute('aria-pressed', String(req.voted));
        button.title = req.voted ? 'Take my vote back' : 'I want this too';

        const n = document.createElement('span');
        n.className = 'n';
        n.textContent = req.votes;

        const cap = document.createElement('span');
        cap.className = 'cap2';
        cap.textContent = 'votes';

        button.append(n, cap);
        button.addEventListener('click', async () => {
          button.disabled = true;
          try {
            if (req.voted) {
              const query =
                '?request=' + encodeURIComponent(req.id) + '&browser=' + encodeURIComponent(me);
              await api('/api/votes' + query, { method: 'DELETE' });
            } else {
              await api('/api/votes', post({ request_id: req.id, browser_id: me }));
            }
            await load();
          } catch (error) {
            say(error.message);
            button.disabled = false;
          }
        });

        return button;
      }

      function renderStatus(req) {
        // Everyone reads where a request has got to; only Gal can move it, and the
        // control simply does not exist for anyone else.
        if (!admin) {
          const label = document.createElement('span');
          label.className = 'state';
          label.textContent = req.status;
          return label;
        }

        const select = document.createElement('select');
        select.className = 'state';
        select.title = 'Where this has got to';

        for (const status of STATUSES) {
          const opt = document.createElement('option');
          opt.value = status;
          opt.textContent = status;
          select.append(opt);
        }

        select.value = req.status;
        select.addEventListener('change', async () => {
          select.disabled = true;
          try {
            await api(
              '/api/status',
              post({ request_id: req.id, status: select.value }, { 'x-admin-password': admin }),
            );
            await load();
          } catch (error) {
            say(error.message);
            select.value = req.status;
            select.disabled = false;

            // A rejected password is worth forgetting, or every card keeps a control that cannot work.
            if (error.status === 401) {
              admin = '';
              write(ADMIN, '');
              render();
            }
          }
        });

        return select;
      }

      function renderTalk(req) {
        const talk = document.createElement('details');
        talk.className = 'talk';

        // The list is redrawn from the board after every change, so an open thread
        // has to remember it was open.
        talk.open = open.has(req.id);
        talk.addEventListener('toggle', () => {
          if (talk.open) open.add(req.id);
          else open.delete(req.id);
        });

        const summary = document.createElement('summary');
        const count = req.comments.length;
        summary.textContent = count === 0 ? 'Add a note' : count === 1 ? '1 note' : count + ' notes';
        talk.append(summary);

        const notes = document.createElement('ul');
        notes.className = 'notes';

        for (const note of req.comments) {
          const item = document.createElement('li');
          item.className = 'note';

          const heading = document.createElement('span');
          heading.className = 'who';
          heading.textContent = note.author + ' · ' + whenOf(note.created_at);

          const body = document.createElement('p');
          body.textContent = note.body;

          item.append(heading, body);
          notes.append(item);
        }

        const reply = document.createElement('form');
        reply.className = 'reply';

        const field = document.createElement('input');
        field.placeholder = 'Add a note';
        field.setAttribute('aria-label', 'Add a note');

        const add = document.createElement('button');
        add.type = 'submit';
        add.textContent = 'Add';

        reply.append(field, add);
        reply.addEventListener('submit', async (event) => {
          event.preventDefault();

          const text = field.value.trim();
          const name = who.value.trim();
          if (!text || !name) {
            say('A note needs your name and something to say.');
            return;
          }

          add.disabled = true;
          try {
            await api('/api/comments', post({ request_id: req.id, author: name, body: text }));
            write(WHO, name);
            open.add(req.id);
            await load();
          } catch (error) {
            say(error.message);
            add.disabled = false;
          }
        });

        talk.append(notes, reply);
        return talk;
      }

      function render() {
        list.replaceChildren();
        empty.hidden = !loaded || rows.length > 0;

        for (const button of sortBar.querySelectorAll('button')) {
          button.setAttribute('aria-pressed', String(button.dataset.sort === sortBy));
        }

        for (const req of rows) {
          const item = document.createElement('li');
          item.className = 'req';

          const meta = document.createElement('p');
          meta.className = 'meta';

          const kind = document.createElement('span');
          kind.className = 'pill pill--' + req.kind;
          kind.textContent = req.kind;

          const game = document.createElement('span');
          game.textContent = nameOf(req.game);

          const by = document.createElement('span');
          by.textContent = req.author + ' · ' + whenOf(req.created_at);

          meta.append(kind, game, by, renderStatus(req));

          const body = document.createElement('p');
          body.className = 'said';
          body.textContent = req.body;

          item.append(renderVote(req), meta, body, renderTalk(req));
          list.append(item);
        }
      }

      sortBar.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;

        sortBy = button.dataset.sort;
        write(SORT, sortBy);
        render();
        load();
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const text = said.value.trim();
        const name = who.value.trim();
        if (!text || !name) return;

        send.disabled = true;
        try {
          await api(
            '/api/requests',
            post({ game: gameSel.value, kind: kindSel.value, body: text, author: name }),
          );
          write(WHO, name);
          said.value = '';
          await load();
        } catch (error) {
          // What was typed stays in the box: a failed send must not lose it.
          say(error.message);
        }

        send.disabled = false;
      });

      load();
    </script>
  </body>
</html>
